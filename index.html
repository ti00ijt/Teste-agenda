<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Colégio Global</title>
  <link rel="stylesheet" href="estilos/style.css">
</head>
<script type="module" src="scripts/login.js"></script>
<body>
  <main class="pagina">
    <section class="cartao" aria-labelledby="titulo">
      <img
        class="logo"
        src="imagens/img.png"
        alt="Colégio Global — Educação unitária"
      >

      <header class="cabecalho">
        <h1 id="titulo">Bem-vindo!</h1>
        <p>Acesse sua conta para continuar.</p>
      </header>

        <form id="form-login" onsubmit="event.preventDefault()">        <div class="campo">
          <label for="login">Login</label>

          <div class="entrada">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/>
            </svg>

            <input
              
              id="login"
              name="login"
              placeholder="Digite seu login"
              autocomplete="username"
              autocapitalize="none"

              required
            >
          </div>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>

          <div class="entrada">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="10" width="14" height="11" rx="2"/>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
              <path d="M12 14v3"/>
            </svg>

            <input
              type="password"
              id="senha"
              name="senha"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
            >
          </div>
        </div>

        <!-- <div class="recuperacao">-->

          <!-- Conecte este botão ao fluxo de recuperação de senha. -->
          <!-- <button class="botao-texto" type="button">-->
           <!--  Esqueci minha senha-->
          <!-- </button>-->
        <!-- </div>-->

       <p id="mensagem-login" role="status" aria-live="polite"></p>

        <button
          id="botao-entrar"
          class="botao-entrar"
          type="submit"
          disabled
        >
          Carregando...
        </button>
      </form>

      <div class="ajuda">
        <span>Precisa de ajuda?</span>
        <!-- Conecte este botão ao contato da secretaria. -->
        <button class="botao-texto" type="button">
          Fale com a secretaria
        </button>
      </div>
      
    </section>

    <footer>Colégio Global • Educação unitária</footer>
  </main>
</body>
</html>
